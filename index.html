<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYB Prototype</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

const { useState, useEffect, useRef } = React;

const Upload = () => <span>📤</span>;
const UserPlus = () => <span>👤</span>;
const Check = () => <span>✓</span>;
const X = () => <span>✕</span>;
const ArrowLeft = () => <span>←</span>;
const Mail = () => <span>✉️</span>;
const Shield = () => <span>🛡️</span>;
const FileText = () => <span>📄</span>;
const AlertCircle = () => <span>⚠️</span>;
const Lock = () => <span>🔒</span>;
const Clock = () => <span>🕒</span>;
const Trash2 = () => <span>🗑️</span>;
const RefreshCw = () => <span>🔄</span>;
const Send = () => <span>📨</span>;
const Info = () => <span>ℹ️</span>;
const Eye = () => <span>👁️</span>;
const CheckCircle = () => <span>✅</span>;
const Building2 = () => <span>🏢</span>;
const File = () => <span>📁</span>;
const ChevronRight = () => <span>›</span>;
const Loader = () => <span>⏳</span>;
const Users = () => <span>👥</span>;
const Star = () => <span>⭐</span>;

function App() {
  const [uploaded, setUploaded] = useState(false);

  return (
    <div style={{
      minHeight: "100vh",
      background: "#F8FAFC",
      padding: "40px",
      fontFamily: "-apple-system, BlinkMacSystemFont, sans-serif"
    }}>
      
      <div style={{
        maxWidth: "700px",
        margin: "0 auto",
        background: "white",
        borderRadius: "20px",
        padding: "32px",
        boxShadow: "0 4px 20px rgba(0,0,0,0.08)"
      }}>

        <div style={{
          display: "flex",
          alignItems: "center",
          gap: "12px",
          marginBottom: "24px"
        }}>
          <div style={{
            width: "48px",
            height: "48px",
            borderRadius: "12px",
            background: "#EEF2FF",
            display: "flex",
            alignItems: "center",
            justifyContent: "center"
          }}>
            <Building2 />
          </div>

          <div>
            <div style={{
              fontSize: "24px",
              fontWeight: "700",
              color: "#111827"
            }}>
              KYB Document Upload
            </div>

            <div style={{
              fontSize: "14px",
              color: "#6B7280",
              marginTop: "4px"
            }}>
              Upload company verification documents
            </div>
          </div>
        </div>

        <div style={{
          border: "1px solid #E5E7EB",
          borderRadius: "16px",
          padding: "24px",
          marginBottom: "20px"
        }}>
          <div style={{
            fontSize: "18px",
            fontWeight: "600",
            marginBottom: "10px"
          }}>
            Trade License
          </div>

          <div style={{
            fontSize: "14px",
            color: "#6B7280",
            marginBottom: "20px"
          }}>
            Current UAE trade license document
          </div>

          {!uploaded ? (
            <button
              onClick={() => setUploaded(true)}
              style={{
                background: "#4F46E5",
                color: "white",
                border: "none",
                borderRadius: "10px",
                padding: "12px 18px",
                fontSize: "14px",
                fontWeight: "600",
                cursor: "pointer"
              }}
            >
              Upload Document
            </button>
          ) : (
            <div style={{
              background: "#ECFDF5",
              border: "1px solid #A7F3D0",
              borderRadius: "10px",
              padding: "16px",
              display: "flex",
              alignItems: "center",
              gap: "10px"
            }}>
              <CheckCircle />
              <div>
                <div style={{
                  fontWeight: "600",
                  color: "#065F46"
                }}>
                  Trade_License_2024.pdf
                </div>

                <div style={{
                  fontSize: "13px",
                  color: "#047857"
                }}>
                  Uploaded successfully
                </div>
              </div>
            </div>
          )}
        </div>

        <button style={{
          width: "100%",
          background: "#111827",
          color: "white",
          border: "none",
          borderRadius: "12px",
          padding: "14px",
          fontSize: "15px",
          fontWeight: "600",
          cursor: "pointer"
        }}>
          Continue
        </button>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
